name: Translation rescan

# Every push to main that changes translations/: the changed .tsv files are scanned again with VirusTotal
# (scripts/virustotal_scan.py), failing closed: flagged, unreachable, too slow or a missing VT_API_KEY secret
# fails the run. The files are this repository's own (already merged); they are only read as data.

on:
  push:
    branches: [main]
    paths:
      - "translations/**"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the changed translation files with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          BEFORE: ${{ github.event.before }}
        run: python -I scripts/virustotal_scan.py --changed-since "$BEFORE"
